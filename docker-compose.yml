version: "3.9"

services:
  api:
    build: .
    container_name: safevision-api
    ports:
      - "8000:7860"
    volumes:
      # Persist violation database across container restarts
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s